name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version $VERSION"
            exit 1
          fi
      - name: Test
        run: |
          # render tests draw a real PNG unless Pillow is missing
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil >/dev/null
          npm test
      - name: Check whether this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "dsh-go-token-usage@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack npm tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Release notes and GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## dsh-go-token-usage ${GITHUB_REF_NAME}"
            echo
            echo "### 更新日志 / Changelog"
            echo
            awk -v version="$VERSION" '
              $0 == "## " version { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
            echo
            echo "### Commits"
            if [ -n "$PREVIOUS" ]; then
              git log --pretty='- %s (%h)' "${PREVIOUS}..${GITHUB_REF_NAME}"
            else
              git log --pretty='- %s (%h)' "${GITHUB_REF_NAME}"
            fi
            echo
            echo "### Install / 安装"
            echo '```sh'
            echo 'npx dsh-go-token-usage install'
            echo '# or: dsh plugin --profile web add dsh-go-token-usage@'"$VERSION"
            echo '```'
            echo
            echo "Counted from the host's own session logs: no account, no network, no estimates."
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md dist/*.tgz \
            || gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          gh release upload "${GITHUB_REF_NAME}" dist/*.tgz --clobber
