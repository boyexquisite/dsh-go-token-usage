name: ci

# Regular tests for main pushes and pull requests. publish.yml only runs on tags,
# so without this a broken main is only discovered when a release is tagged.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.x'
          - '24.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Pillow (render tests draw a real PNG)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil fonts-noto-cjk >/dev/null
      - name: Test
        run: npm test
